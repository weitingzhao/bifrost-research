version: 2

sources:
  - name: market
    database: bifrost_golden_source
    schema: raw_market
    description: "Plugin Golden Source — public market data ingested by Market Data Plugin"
    tables:
      - name: stock_daily
        description: "OHLCV daily bars for US equities"
        columns:
          - name: symbol
            description: "Ticker symbol"
            tests:
              - not_null
          - name: bar_date
            description: "Trading date"
            tests:
              - not_null
          - name: close
            description: "Closing price"
          - name: volume
            description: "Daily volume"

      - name: income_statement
        description: "Income statement jsonb rows (Wave 8 split from stock_financials)"
        columns:
          - name: symbol
            tests:
              - not_null
          - name: period_date
            tests:
              - not_null
          - name: data
            description: "jsonb blob with report-specific fields"

      - name: balance_sheet
        description: "Balance sheet jsonb rows"
        columns:
          - name: symbol
            tests:
              - not_null
          - name: period_date
            tests:
              - not_null

      - name: cash_flow
        description: "Cash flow statement jsonb rows"
        columns:
          - name: symbol
            tests:
              - not_null
          - name: period_date
            tests:
              - not_null

      - name: ratios
        description: "Financial ratios jsonb rows (often source-void)"
        columns:
          - name: symbol
            tests:
              - not_null

      - name: short_interest
        description: "Short interest jsonb rows"
        columns:
          - name: symbol
            tests:
              - not_null

      - name: short_volume
        description: "Short volume jsonb rows"
        columns:
          - name: symbol
            tests:
              - not_null

      - name: stock_financials
        description: "Compat view UNION over split financials tables (Wave 8)"
        columns:
          - name: symbol
            tests:
              - not_null
          - name: report_type
            description: "One of: income_statement, balance_sheet, cash_flow_statement, ratios, short_interest, short_volume"
            tests:
              - not_null
              - accepted_values:
                  values:
                    - income_statement
                    - balance_sheet
                    - cash_flow_statement
                    - ratios
                    - short_interest
                    - short_volume
          - name: period_date
            tests:
              - not_null
          - name: data
            description: "jsonb blob with report-specific fields"

      - name: stock_snapshot
        description: "Intraday snapshot (latest session prices)"
        columns:
          - name: symbol
            tests:
              - not_null
          - name: session_date
            tests:
              - not_null

      - name: ticker
        description: "Security master — ticker metadata for universe definition"
        columns:
          - name: symbol
            tests:
              - not_null
              - unique
          - name: type
            description: "Security type (CS = common stock)"
          - name: market
            description: "Market segment (stocks, otc, etc.)"
          - name: active
            description: "Whether the ticker is currently active"

      - name: us_market_holiday
        description: "US market holidays and early-close dates"
        columns:
          # Column is holiday_date, not date — dim_trading_calendar.sql has always
          # read it correctly; only this test declaration named a column that does
          # not exist, so the test errored (not failed) and took dbt build with it.
          - name: holiday_date
            tests:
              - not_null
          - name: status
            description: "closed or early-close"

  - name: features
    database: bifrost_golden_source
    schema: features
    description: "Research Feature Store — read-only for dbt SEPA options tier + canonical PnL"
    tables:
      - name: option_metric_iv_percentile_daily
      - name: option_metric_pcr_daily
      - name: option_metric_gex_levels_daily
      - name: stock_signal_canonical_pnl_daily
        description: "Canonical structure hypothetical PnL (Python engine authority)"
