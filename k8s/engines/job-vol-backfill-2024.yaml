apiVersion: batch/v1
kind: Job
metadata:
  name: research-vol-backfill-2024
  namespace: research
  labels:
    app.kubernetes.io/name: research-vol-backfill-2024
    app.kubernetes.io/part-of: bifrost-research
    bifrost.research/wave: "7.2"
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: research-vol-backfill-2024
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-pg
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 60); do
                if nc -z -w 2 bifrost-postgres-rw.data.svc.cluster.local 5432; then
                  echo ready; exit 0
                fi
                echo "wait $i"; sleep 2
              done
              exit 1
        - name: ensure-partitions
          image: 192.168.10.73:30500/bifrost-research:0.8.1
          imagePullPolicy: Always
          command:
            - python
            - -c
            - |
              from bifrost_research.db.conn import connect
              from bifrost_research.schema.ddl import ensure_month_partitions
              conn = connect()
              ensure_month_partitions(conn, months_back=24, months_forward=4)
              conn.close()
              print("ensure_month_partitions ok")
          envFrom:
            - secretRef:
                name: bifrost-research-secrets
                optional: true
          env:
            - name: ANALYTICS_PG_HOST
              value: "bifrost-postgres-rw.data.svc.cluster.local"
            - name: ANALYTICS_PG_PORT
              value: "5432"
            - name: ANALYTICS_PG_DATABASE
              value: "bifrost_golden_source"
            - name: ANALYTICS_PG_USER
              value: "analytics_writer"
      containers:
        - name: max-pain
          image: 192.168.10.73:30500/bifrost-research:0.8.1
          imagePullPolicy: Always
          args:
            - python
            - -m
            - bifrost_research.scheduler.volatility
            - --slot
            - max-pain
            - --lookback-days
            - "900"
            - --as-of
            - "2026-08-23"
          envFrom:
            - secretRef:
                name: bifrost-research-secrets
                optional: true
          env:
            - name: ANALYTICS_PG_HOST
              value: "bifrost-postgres-rw.data.svc.cluster.local"
            - name: ANALYTICS_PG_PORT
              value: "5432"
            - name: ANALYTICS_PG_DATABASE
              value: "bifrost_golden_source"
            - name: ANALYTICS_PG_USER
              value: "analytics_writer"
            - name: RESEARCH_WATCHLIST
              value: "SPY,QQQ,IWM,SPX,NVDA,AAPL,META,GOOG,AMZN,MSFT,TSLA,PLTR,MU,MRVL,ANET,CAVA,CBRS,DAVE,DDOG,ECHO,HIMS,NBIS,NNE,RKLB,SATS,SPCX"
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
        - name: atm-iv-pcr
          image: 192.168.10.73:30500/bifrost-research:0.8.1
          imagePullPolicy: Always
          args:
            - python
            - -m
            - bifrost_research.scheduler.volatility
            - --slot
            - atm-iv-pcr
            - --lookback-days
            - "900"
            - --as-of
            - "2026-08-23"
          envFrom:
            - secretRef:
                name: bifrost-research-secrets
                optional: true
          env:
            - name: ANALYTICS_PG_HOST
              value: "bifrost-postgres-rw.data.svc.cluster.local"
            - name: ANALYTICS_PG_PORT
              value: "5432"
            - name: ANALYTICS_PG_DATABASE
              value: "bifrost_golden_source"
            - name: ANALYTICS_PG_USER
              value: "analytics_writer"
            - name: RESEARCH_WATCHLIST
              value: "SPY,QQQ,IWM,SPX,NVDA,AAPL,META,GOOG,AMZN,MSFT,TSLA,PLTR,MU,MRVL,ANET,CAVA,CBRS,DAVE,DDOG,ECHO,HIMS,NBIS,NNE,RKLB,SATS,SPCX"
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
        - name: iv-percentile
          image: 192.168.10.73:30500/bifrost-research:0.8.1
          imagePullPolicy: Always
          args:
            - python
            - -m
            - bifrost_research.scheduler.volatility
            - --slot
            - iv-percentile
            - --lookback-days
            - "900"
            - --as-of
            - "2026-08-23"
          envFrom:
            - secretRef:
                name: bifrost-research-secrets
                optional: true
          env:
            - name: ANALYTICS_PG_HOST
              value: "bifrost-postgres-rw.data.svc.cluster.local"
            - name: ANALYTICS_PG_PORT
              value: "5432"
            - name: ANALYTICS_PG_DATABASE
              value: "bifrost_golden_source"
            - name: ANALYTICS_PG_USER
              value: "analytics_writer"
            - name: RESEARCH_WATCHLIST
              value: "SPY,QQQ,IWM,SPX,NVDA,AAPL,META,GOOG,AMZN,MSFT,TSLA,PLTR,MU,MRVL,ANET,CAVA,CBRS,DAVE,DDOG,ECHO,HIMS,NBIS,NNE,RKLB,SATS,SPCX"
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
