apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    # One-off Job: run by hand (kubectl create), never applied by Argo CD.
    # Runs as analytics_writer, which is a member of the owning role `bifrost`
    # and holds CREATE on both schemas, so CREATE / ALTER succeed. The
    # InsufficientPrivilege seen on 2026-09-06 (B2 ai_action_log columns) came
    # from research.agent_persona still being owned by `postgres`: one ALTER
    # aborted the transaction and took the rest of the batch with it. Ownership
    # was transferred to `bifrost` on 2026-09-07 and the whole schema is uniform.
    # Scope is `all` — features + the research workflow tables. Anything the Job
    # creates is owned by analytics_writer, so sweep ownership back to `bifrost`
    # afterwards to keep the schema single-owner:
    #   ALTER TABLE research.<t> OWNER TO bifrost;
    # A Job's pod template is immutable, so every image-pin bump made the app
    # sync fail on "field is immutable" (research-loop-automation 0.68.0 release).
    argocd.argoproj.io/hook: Skip
  name: research-ddl-apply-rla-postreview
  namespace: research
  labels:
    app.kubernetes.io/name: research-ddl-apply
    app.kubernetes.io/part-of: bifrost-research
    bifrost.research/wave: rla-postreview
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: research-ddl-apply
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-pg
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 60); do
                if nc -z -w 2 bifrost-postgres-rw.data.svc.cluster.local 5432; then
                  echo ready; exit 0
                fi
                echo "wait $i"; sleep 2
              done
              exit 1
      containers:
        - name: ddl
          image: 192.168.10.73:30500/bifrost-research:0.77.0
          imagePullPolicy: Always
          args:
            - python
            - -m
            - bifrost_research.schema.init
            - --apply
            - --scope
            - all
          envFrom:
            - secretRef:
                name: bifrost-research-secrets
                optional: true
          env:
            - name: ANALYTICS_PG_HOST
              value: "bifrost-postgres-rw.data.svc.cluster.local"
            - name: ANALYTICS_PG_PORT
              value: "5432"
            - name: ANALYTICS_PG_DATABASE
              value: "bifrost_golden_source"
            - name: ANALYTICS_PG_USER
              value: "analytics_writer"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
