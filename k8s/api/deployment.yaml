apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-api
  namespace: research
  labels:
    app.kubernetes.io/name: research-api
    app.kubernetes.io/part-of: bifrost-research
    bifrost.research/role: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: research-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: research-api
        app.kubernetes.io/part-of: bifrost-research
        bifrost.research/role: api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: 192.168.10.73:30500/bifrost-research:0.96.0
          imagePullPolicy: Always
          args: ["python", "scripts/run_api.py"]
          envFrom:
            - secretRef:
                name: bifrost-research-secrets
                optional: true
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8795"
            - name: ANALYTICS_PG_HOST
              value: "bifrost-postgres-rw.data.svc.cluster.local"
            - name: ANALYTICS_PG_PORT
              value: "5432"
            - name: ANALYTICS_PG_DATABASE
              value: "bifrost_golden_source"
            - name: ANALYTICS_PG_USER
              value: "analytics_writer"
            - name: ELEMENTARY_REPORT_PATH
              value: "/report/elementary_report.html"
            - name: RESEARCH_MCP_SSE_URL
              value: "http://research-mcp.research.svc.cluster.local:8796/sse"
            # The Run dialog starts a batch in this pod's background thread, and
            # prices it from the judges' history. Until now this pod had none of
            # the CronJob's judge settings, so a UI-started run fell back to the
            # heuristic and the heuristic planner — the dialog quoted $0.25 for
            # two model judges and the run spent nothing and rated on nothing.
            # Same judges, models, turn leash, purses and timeouts as
            # k8s/engines/cronjob-harness.yaml; the purses are seeded from the
            # ledger, so the CronJob and a UI run share one daily cap.
            # BIFROST_LOOP_BATCH_MODE is deliberately absent: a UI run is the
            # Owner pressing a button, not the unattended loop, so nothing is
            # auto-approved here.
            - name: BIFROST_HARNESS_LLM_PLAN
              value: "1"
            - name: BIFROST_PERSONA_EVAL_AGENTS
              value: "1"
            - name: PERSONA_EVAL_MODELS
              value: "deepseek-chat,gpt-4o-mini"
            # Rebalanced 2026-09-08, total unchanged at $3.50 — see
            # k8s/engines/cronjob-harness.yaml for the observed numbers.
            - name: PERSONA_EVAL_DAILY_CAP_USD_DEEPSEEK
              value: "2.25"
            - name: PERSONA_EVAL_DAILY_CAP_USD_OPENAI
              value: "1.25"
            - name: BIFROST_PERSONA_EVAL_MAX_TURNS
              value: "4"
            - name: BIFROST_PERSONA_EVAL_SYMBOL_TIMEOUT_S
              value: "120"
            - name: BIFROST_PERSONA_EVAL_TIMEOUT_S
              value: "900"
            # The portfolio specialist reads holdings from the Trade read-only
            # backends; without these it reports "tool configuration issue".
            - name: TRADE_API_MONITOR_URL
              value: "http://api-monitor.bifrost-prod.svc.cluster.local:8765"
            - name: TRADE_API_TRADING_URL
              value: "http://api-trading.bifrost-prod.svc.cluster.local:8769"
            - name: TRADE_API_STRATEGY_URL
              value: "http://api-strategy.bifrost-prod.svc.cluster.local:8769"
            - name: TRADE_API_MARKET_URL
              value: "http://api-market.bifrost-prod.svc.cluster.local:8772"
            - name: TRADE_API_TIMEOUT
              value: "8.0"
            - name: PLATFORM_API_URL
              value: "http://platform-api.bifrost-platform-prod.svc.cluster.local:8780"
          ports:
            - name: http
              containerPort: 8795
          volumeMounts:
            - name: report-volume
              mountPath: /report
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: report-volume
          persistentVolumeClaim:
            claimName: analytics-report-pvc
