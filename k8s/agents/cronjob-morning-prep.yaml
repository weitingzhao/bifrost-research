apiVersion: batch/v1
kind: CronJob
metadata:
  name: research-morning-prep
  namespace: research
  labels:
    app.kubernetes.io/name: research-morning-prep
    app.kubernetes.io/part-of: bifrost-research
    bifrost.research/slot: morning-prep
spec:
  # 06:30 ET ≈ 11:30 UTC (EST); adjust for EDT as needed
  schedule: "30 11 * * MON-FRI"
  timeZone: UTC
  # Suspended: Dagster multi-schedule owns this slot
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: research-morning-prep
            bifrost.research/slot: morning-prep
        spec:
          restartPolicy: Never
          initContainers:
            - name: wait-pg
              image: busybox:1.36
              command:
                - sh
                - -c
                - |
                  for i in $(seq 1 60); do
                    if nc -z -w 2 bifrost-postgres-rw.data.svc.cluster.local 5432; then
                      echo ready; exit 0
                    fi
                    echo "wait $i"; sleep 2
                  done
                  exit 1
          containers:
            - name: morning-prep
              image: 192.168.10.73:30500/bifrost-research:0.65.3
              imagePullPolicy: Always
              args:
                - python
                - /app/scripts/run_morning_agent.py
              envFrom:
                - secretRef:
                    name: bifrost-research-secrets
                    optional: true
              env:
                - name: ANALYTICS_PG_HOST
                  value: "bifrost-postgres-rw.data.svc.cluster.local"
                - name: ANALYTICS_PG_PORT
                  value: "5432"
                - name: ANALYTICS_PG_DATABASE
                  value: "bifrost_golden_source"
                - name: ANALYTICS_PG_USER
                  value: "analytics_writer"
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
