apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    # One-off Job: run by hand (kubectl create), never applied by Argo CD.
    # A Job's pod template is immutable, so every image-pin bump made the app
    # sync fail on "field is immutable" (research-loop-automation 0.68.0 release).
    argocd.argoproj.io/hook: Skip
  name: research-iv-solver-backfill
  namespace: research
  labels:
    app.kubernetes.io/name: research-iv-solver-backfill
    app.kubernetes.io/part-of: bifrost-research
    bifrost.research/slot: iv-solver-backfill
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: research-iv-solver-backfill
        bifrost.research/slot: iv-solver-backfill
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-pg
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 60); do
                if nc -z -w 2 bifrost-postgres-rw.data.svc.cluster.local 5432; then
                  echo ready; exit 0
                fi
                echo "wait $i"; sleep 2
              done
              exit 1
      containers:
        - name: compute
          image: 192.168.10.73:30500/bifrost-research:0.69.0
          imagePullPolicy: Always
          args:
            - python
            - -m
            - bifrost_research.engines.volatility.iv_solver_entry
            - --lookback-days
            - "252"
            - --source
            - all
          envFrom:
            - secretRef:
                name: bifrost-research-secrets
                optional: true
          env:
            - name: ANALYTICS_PG_HOST
              value: "bifrost-postgres-rw.data.svc.cluster.local"
            - name: ANALYTICS_PG_PORT
              value: "5432"
            - name: ANALYTICS_PG_DATABASE
              value: "bifrost_golden_source"
            - name: ANALYTICS_PG_USER
              value: "analytics_writer"
            - name: RESEARCH_LOOKBACK_DAYS
              value: "252"
            - name: RESEARCH_WATCHLIST
              value: "SPY,QQQ,IWM,SPX,NVDA,AAPL,META,GOOG,AMZN,MSFT,TSLA,PLTR,MU,MRVL,ANET,CAVA,CBRS,DAVE,DDOG,ECHO,HIMS,NBIS,NNE,RKLB,SATS,SPCX"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
