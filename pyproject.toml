[project]
name = "bifrost-research"
version = "0.18.0"
description = "Bifrost Research Engine — OLAP analytics, engines, and Research API"
requires-python = ">=3.11"
dependencies = [
    "dbt-core>=1.8,<2.0",
    "dbt-postgres>=1.8,<2.0",
    "elementary-data[postgres]>=0.16.0,<1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.27.0",
    "mcp>=1.19.0,<2",
]

[project.optional-dependencies]
orchestration = [
    "dagster>=1.9,<2.0",
    "dagster-dbt>=0.25,<1.0",
    "dagster-webserver>=1.9,<2.0",
]
copilot = [
    "anthropic>=0.30",
    "openai>=1.40",
    "openai-agents>=0.6,<1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "sqlfluff>=3.0",
    "sqlfluff-templater-dbt>=3.0",
]

# Dagster code location (alternative to workspace.yaml)
[tool.dagster]
module_name = "bifrost_research.orchestration.definitions"
attribute = "defs"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
