apiVersion: batch/v1
kind: CronJob
metadata:
  name: research-ensure-partitions
  namespace: research
  labels:
    app.kubernetes.io/name: research-ensure-partitions
    app.kubernetes.io/part-of: bifrost-research
    bifrost.research/slot: ensure-partitions
spec:
  schedule: "30 0 1 * *"
  timeZone: UTC
  # Suspended: Dagster multi-schedule owns this slot
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: research-ensure-partitions
            bifrost.research/slot: ensure-partitions
        spec:
          restartPolicy: Never
          initContainers:
            - name: wait-pg
              image: busybox:1.36
              command:
                - sh
                - -c
                - |
                  for i in $(seq 1 60); do
                    if nc -z -w 2 bifrost-postgres-rw.data.svc.cluster.local 5432; then
                      echo ready; exit 0
                    fi
                    echo "wait $i"; sleep 2
                  done
                  exit 1
          containers:
            - name: ensure-partitions
              image: 192.168.10.73:30500/bifrost-research:0.65.4
              imagePullPolicy: Always
              command:
                - python
                - -c
                - |
                  from bifrost_research.db.conn import connect
                  from bifrost_research.schema.ddl import ensure_month_partitions

                  conn = connect()
                  ensure_month_partitions(conn, months_back=3, months_forward=4)
                  conn.close()
                  print("ensure_month_partitions ok")
              envFrom:
                - secretRef:
                    name: bifrost-research-secrets
                    optional: true
              env:
                - name: ANALYTICS_PG_HOST
                  value: "bifrost-postgres-rw.data.svc.cluster.local"
                - name: ANALYTICS_PG_PORT
                  value: "5432"
                - name: ANALYTICS_PG_DATABASE
                  value: "bifrost_golden_source"
                - name: ANALYTICS_PG_USER
                  value: "analytics_writer"
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
