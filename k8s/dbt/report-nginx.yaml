apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-docs
  namespace: research
  labels:
    app: analytics-docs
    component: elementary-report
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-docs
  template:
    metadata:
      labels:
        app: analytics-docs
        component: elementary-report
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8061
          volumeMounts:
            - name: report-volume
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: report-volume
          persistentVolumeClaim:
            claimName: analytics-report-pvc
        - name: nginx-conf
          configMap:
            name: analytics-docs-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-docs
  namespace: research
  labels:
    app: analytics-docs
    component: elementary-report
spec:
  selector:
    app: analytics-docs
  ports:
    - name: http
      port: 8061
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-docs-nginx
  namespace: research
  labels:
    app: analytics-docs
data:
  default.conf: |
    server {
      listen 8061;
      server_name _;
      root /usr/share/nginx/html;
      index elementary_report.html index.html;

      location / {
        try_files $uri $uri/ /elementary_report.html =404;
        add_header Cache-Control "no-cache";
      }

      location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
      }
    }
