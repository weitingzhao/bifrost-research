# Event Radar news ingest CronJob (Owner decision A · research-radar-news-source).
#
# Mount Research-workspace input/ (or a synced PVC) at /data/event-radar/input.
# See docs/EVENT_RADAR_INGEST.md for Mac hostPath / PVC wiring.
#
# D10 BLOCKED — advisory OLAP only (research.event_radar).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: event-radar-input-pvc
  namespace: research
  labels:
    app.kubernetes.io/name: event-radar-input
    app.kubernetes.io/part-of: bifrost-research
    bifrost.research/slot: event-radar
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: research-engines-event-radar
  namespace: research
  labels:
    app.kubernetes.io/name: research-engines-event-radar
    app.kubernetes.io/part-of: bifrost-research
    bifrost.research/slot: event-radar
spec:
  # Every 30 minutes on weekdays — Owner drops files into input/; Cron drains.
  schedule: "*/30 * * * 1-5"
  timeZone: America/New_York
  # Suspended: Dagster multi-schedule owns this slot
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: research-engines-event-radar
            bifrost.research/slot: event-radar
        spec:
          restartPolicy: Never
          initContainers:
            - name: wait-pg
              image: busybox:1.36
              command:
                - sh
                - -c
                - |
                  for i in $(seq 1 60); do
                    if nc -z -w 2 bifrost-postgres-rw.data.svc.cluster.local 5432; then
                      echo ready; exit 0
                    fi
                    echo "wait $i"; sleep 2
                  done
                  exit 1
          containers:
            - name: ingest
              image: 192.168.10.73:30500/bifrost-research:0.51.0
              imagePullPolicy: Always
              args:
                - python
                - -m
                - bifrost_research.scheduler.event_radar
              envFrom:
                - secretRef:
                    name: bifrost-research-secrets
                    optional: true
              env:
                - name: ANALYTICS_PG_HOST
                  value: "bifrost-postgres-rw.data.svc.cluster.local"
                - name: ANALYTICS_PG_PORT
                  value: "5432"
                - name: ANALYTICS_PG_DATABASE
                  value: "bifrost_golden_source"
                - name: ANALYTICS_PG_USER
                  value: "analytics_writer"
                - name: EVENT_RADAR_INPUT_DIR
                  value: "/data/event-radar/input"
                - name: EVENT_RADAR_ARCHIVE_DIR
                  value: "/data/event-radar/archive"
                - name: EVENT_RADAR_ARCHIVE
                  value: "1"
              volumeMounts:
                - name: event-radar-data
                  mountPath: /data/event-radar
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: event-radar-data
              persistentVolumeClaim:
                claimName: event-radar-input-pvc
# ---------------------------------------------------------------------------
# Optional Mac / node hostPath alternative (replace volumes above):
#
#   volumes:
#     - name: event-radar-data
#       hostPath:
#         path: /Users/vision-mac-trader/Desktop/stocks/Research-workspace/事件雷达工作流
#         type: DirectoryOrCreate
#
# Then set:
#   EVENT_RADAR_INPUT_DIR=/data/event-radar/input
#   EVENT_RADAR_ARCHIVE_DIR=/data/event-radar/archive
# with mountPath pointing at the workflow root so input/ + archive/ align
# with Research-workspace offline convention.
# ---------------------------------------------------------------------------
