# Dagster webserver / daemon for research NS — batch husbandry scheduler.
# Instance storage: Golden Source schema ops_dagster (scripts/ops_dagster_schema.sql).
# Image: orchestration target (dagster + dagster-dbt + dagster-postgres).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dagster-workspace
  namespace: research
  labels:
    app.kubernetes.io/part-of: bifrost-research
    bifrost.research/role: orchestration
data:
  workspace.yaml: |
    load_from:
      - python_module:
          module_name: bifrost_research.orchestration.definitions
          attribute: defs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dagster-instance
  namespace: research
  labels:
    app.kubernetes.io/part-of: bifrost-research
    bifrost.research/role: orchestration
data:
  dagster.yaml: |
    storage:
      postgres:
        postgres_db:
          username:
            env: ANALYTICS_PG_USER
          password:
            env: ANALYTICS_PG_PASSWORD
          hostname:
            env: ANALYTICS_PG_HOST
          db_name:
            env: ANALYTICS_PG_DATABASE
          port:
            env: ANALYTICS_PG_PORT
          params:
            options: "-c search_path=ops_dagster,public"
    # A run whose process dies — a daemon restart, an OOM kill — stays STARTED
    # forever without this, and a zombie run is indistinguishable from a healthy
    # one on every surface we have. research_trading_day sat STARTED for 20.5h
    # on 2026-09-08 with no process behind it and no alert, so the six analytical
    # faces went unrecomputed from 09-05 and nothing said so.
    run_monitoring:
      enabled: true
      start_timeout_seconds: 300
      # The job takes ~5 minutes at 27 symbols and is projected near 5 hours at
      # 575, so the ceiling is generous; it exists to catch a corpse, not to
      # bound a slow run.
      max_runtime_seconds: 32400
      poll_interval_seconds: 120
      max_resume_run_attempts: 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dagster-webserver
  namespace: research
  labels:
    app.kubernetes.io/name: dagster-webserver
    app.kubernetes.io/part-of: bifrost-research
    bifrost.research/role: orchestration
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dagster-webserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dagster-webserver
        bifrost.research/role: orchestration
    spec:
      containers:
        - name: webserver
          image: 192.168.10.73:30500/bifrost-research:0.102.0-dagster
          imagePullPolicy: IfNotPresent
          command:
            [
              "dagster-webserver",
              "-h",
              "0.0.0.0",
              "-p",
              "3000",
              "-w",
              "/opt/dagster/workspace.yaml",
            ]
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: bifrost-research-secrets
                optional: true
          env:
            - name: DAGSTER_HOME
              value: /opt/dagster/home
            - name: ANALYTICS_PG_HOST
              value: "bifrost-postgres-rw.data.svc.cluster.local"
            - name: ANALYTICS_PG_PORT
              value: "5432"
            - name: ANALYTICS_PG_DATABASE
              value: "bifrost_golden_source"
            - name: ANALYTICS_PG_USER
              value: "analytics_writer"
            - name: MARKET_DATA_API_URL
              value: "http://market-data-api.plugin-market-data.svc.cluster.local:8790"
            - name: FLEX_QUERY_API_URL
              value: "http://flex-query-api.plugin-flex-query.svc.cluster.local:8791"
            - name: MARKET_DATA_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bifrost-research-secrets
                  key: market-data-write-token
                  optional: true
            - name: FLEX_QUERY_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bifrost-research-secrets
                  key: flex-query-write-token
                  optional: true
          volumeMounts:
            - name: workspace
              mountPath: /opt/dagster/workspace.yaml
              subPath: workspace.yaml
            - name: dagster-home
              mountPath: /opt/dagster/home
            - name: instance
              mountPath: /opt/dagster/home/dagster.yaml
              subPath: dagster.yaml
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: workspace
          configMap:
            name: dagster-workspace
        - name: dagster-home
          emptyDir: {}
        - name: instance
          configMap:
            name: dagster-instance
---
apiVersion: v1
kind: Service
metadata:
  name: dagster-webserver
  namespace: research
  labels:
    app.kubernetes.io/name: dagster-webserver
    bifrost.research/role: orchestration
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: dagster-webserver
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30301
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dagster-daemon
  namespace: research
  labels:
    app.kubernetes.io/name: dagster-daemon
    app.kubernetes.io/part-of: bifrost-research
    bifrost.research/role: orchestration
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dagster-daemon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dagster-daemon
        bifrost.research/role: orchestration
    spec:
      containers:
        - name: daemon
          image: 192.168.10.73:30500/bifrost-research:0.102.0-dagster
          imagePullPolicy: IfNotPresent
          command: ["dagster-daemon", "run", "-w", "/opt/dagster/workspace.yaml"]
          envFrom:
            - secretRef:
                name: bifrost-research-secrets
                optional: true
          env:
            - name: DAGSTER_HOME
              value: /opt/dagster/home
            - name: ANALYTICS_PG_HOST
              value: "bifrost-postgres-rw.data.svc.cluster.local"
            - name: ANALYTICS_PG_PORT
              value: "5432"
            - name: ANALYTICS_PG_DATABASE
              value: "bifrost_golden_source"
            - name: ANALYTICS_PG_USER
              value: "analytics_writer"
            - name: MARKET_DATA_API_URL
              value: "http://market-data-api.plugin-market-data.svc.cluster.local:8790"
            - name: FLEX_QUERY_API_URL
              value: "http://flex-query-api.plugin-flex-query.svc.cluster.local:8791"
            - name: MARKET_DATA_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bifrost-research-secrets
                  key: market-data-write-token
                  optional: true
            - name: FLEX_QUERY_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bifrost-research-secrets
                  key: flex-query-write-token
                  optional: true
          volumeMounts:
            - name: workspace
              mountPath: /opt/dagster/workspace.yaml
              subPath: workspace.yaml
            - name: dagster-home
              mountPath: /opt/dagster/home
            - name: instance
              mountPath: /opt/dagster/home/dagster.yaml
              subPath: dagster.yaml
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              # Runs execute inside this container (DefaultRunLauncher), so every step
              # subprocess shares it. 2Gi OOMKilled it on 2026-09-11 02:34:31 when the
              # trading-day fan-out started; the job now caps concurrency at 3 as well.
              memory: 4Gi
      volumes:
        - name: workspace
          configMap:
            name: dagster-workspace
        - name: dagster-home
          emptyDir: {}
        - name: instance
          configMap:
            name: dagster-instance
