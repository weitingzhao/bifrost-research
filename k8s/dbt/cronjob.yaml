apiVersion: batch/v1
kind: CronJob
metadata:
  name: bifrost-analytics-daily
  namespace: research
  labels:
    app: bifrost-analytics
    component: dbt-runner
spec:
  # After market close + Massive ingest; Elementary report written to PVC
  schedule: "0 3 * * 1-5"
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: bifrost-analytics
            component: dbt-runner
        spec:
          restartPolicy: Never
          initContainers:
            - name: wait-pg
              image: busybox:1.36
              command:
                - sh
                - -c
                - |
                  for i in $(seq 1 60); do
                    if nc -z -w 2 bifrost-postgres-rw.data.svc.cluster.local 5432; then
                      echo ready; exit 0
                    fi
                    echo "wait $i"; sleep 2
                  done
                  exit 1
          containers:
            - name: dbt-runner
              image: 192.168.10.73:30500/bifrost-research:0.17.2
              imagePullPolicy: Always
              workingDir: /app/src/bifrost_research/dbt
              command: ["bash", "-lc"]
              args:
                - |
                  set -euo pipefail
                  echo "=== bifrost-research dbt run ==="
                  dbt deps --profiles-dir . || true
                  rm -f target/partial_parse.msgpack
                  dbt run --no-partial-parse --target "${DBT_TARGET:-dev}" --profiles-dir .
                  dbt test --no-partial-parse --target "${DBT_TARGET:-dev}" --profiles-dir . || echo "tests non-blocking"
                  echo "=== SEPA projection (mart_sepa_feature_daily → features.stock_signal_sepa_daily) ==="
                  python -c "from bifrost_research.db.conn import connect; from bifrost_research.orchestration.sepa_projection import run_sepa_projection; c=connect(); print(run_sepa_projection(c)); c.close()"
              envFrom:
                - configMapRef:
                    name: bifrost-analytics-config
                - secretRef:
                    name: bifrost-analytics-secrets
              env:
                - name: DBT_TARGET
                  value: "dev"
                - name: ELEMENTARY_REPORT_PATH
                  value: "/report/elementary_report.html"
              volumeMounts:
                - name: report-volume
                  mountPath: /report
              resources:
                requests:
                  cpu: 500m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
          volumes:
            - name: report-volume
              persistentVolumeClaim:
                claimName: analytics-report-pvc
