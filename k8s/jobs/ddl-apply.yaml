apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    # One-off Job: run by hand (kubectl create), never applied by Argo CD.
    # Runs as analytics_writer, which owns the `features` and `research` schemas
    # and every relation in them since TD-85 D2 (2026-10-04: ownership moved
    # off `bifrost`, membership in `bifrost` revoked). Postgres checks ownership
    # before IF NOT EXISTS, so CREATE / ALTER succeed only on analytics_writer's
    # own objects — one foreign-owned relation aborts the whole batch (as
    # research.agent_persona owned by `postgres` did on 2026-09-06).
    # Scope is `all` — features + the research workflow tables. What the Job
    # creates is owned by analytics_writer, which is already the schema-wide
    # owner, and its default privileges grant `bifrost` access: no sweep needed.
    # Do NOT move ownership back to `bifrost`.
    # A Job's pod template is immutable, so every image-pin bump made the app
    # sync fail on "field is immutable" (research-loop-automation 0.68.0 release).
    argocd.argoproj.io/hook: Skip
  name: research-ddl-apply-backtest-sim
  namespace: research
  labels:
    app.kubernetes.io/name: research-ddl-apply
    app.kubernetes.io/part-of: bifrost-research
    bifrost.research/wave: backtest-sim
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: research-ddl-apply
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-pg
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 60); do
                if nc -z -w 2 bifrost-postgres-rw.data.svc.cluster.local 5432; then
                  echo ready; exit 0
                fi
                echo "wait $i"; sleep 2
              done
              exit 1
      containers:
        - name: ddl
          image: 192.168.10.73:30500/bifrost-research:0.174.1
          imagePullPolicy: Always
          args:
            - python
            - -m
            - bifrost_research.schema.init
            - --apply
            - --scope
            - all
          envFrom:
            - secretRef:
                name: bifrost-research-secrets
                optional: true
          env:
            - name: ANALYTICS_PG_HOST
              value: "bifrost-postgres-rw.data.svc.cluster.local"
            - name: ANALYTICS_PG_PORT
              value: "5432"
            - name: ANALYTICS_PG_DATABASE
              value: "bifrost_golden_source"
            - name: ANALYTICS_PG_USER
              value: "analytics_writer"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
