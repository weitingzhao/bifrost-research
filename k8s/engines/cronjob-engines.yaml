# Suspended Job templates only: Dagster runs these engines. They stay because
# bifrost-platform api/internal/research/cronjob_trigger.go creates Jobs from
# them by name (POST /research/cronjobs/{name}/trigger). Delete them together
# with that whitelist. No RESEARCH_WATCHLIST: a triggered run uses the same
# universe rule as Dagster (TD-124; tests/test_k8s_cronjobs.py).
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: research-engines-momentum
  namespace: research
  labels:
    app.kubernetes.io/name: research-engines-momentum
    app.kubernetes.io/part-of: bifrost-research
    bifrost.research/slot: momentum
spec:
  schedule: "30 23 * * 1-5"
  timeZone: UTC
  # Suspended: Dagster research_trading_day / plugin_batch owns this slot
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: research-engines-momentum
            bifrost.research/slot: momentum
        spec:
          restartPolicy: Never

          initContainers:
            - name: wait-pg
              image: busybox:1.36
              command:
                - sh
                - -c
                - |
                  for i in $(seq 1 60); do
                    if nc -z -w 2 bifrost-postgres-rw.data.svc.cluster.local 5432; then
                      echo ready; exit 0
                    fi
                    echo "wait $i"; sleep 2
                  done
                  exit 1
          containers:
            - name: compute
              image: 192.168.10.73:30500/bifrost-research:0.201.0
              imagePullPolicy: Always
              args:
                - python
                - -m
                - bifrost_research.scheduler.engines
                - --slot
                - momentum
                - --lookback-days
                - "30"
              envFrom:
                - secretRef:
                    name: bifrost-research-secrets
                    optional: true
              env:
                - name: ANALYTICS_PG_HOST
                  value: "bifrost-postgres-rw.data.svc.cluster.local"
                - name: ANALYTICS_PG_PORT
                  value: "5432"
                - name: ANALYTICS_PG_DATABASE
                  value: "bifrost_golden_source"
                - name: ANALYTICS_PG_USER
                  value: "analytics_writer"
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
---
