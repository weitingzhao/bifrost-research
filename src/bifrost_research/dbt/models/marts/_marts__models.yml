version: 2

models:
  - name: mart_sepa_fundamental_eval
    description: "8 core fundamental conditions as boolean columns with pass_count summary"
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: eval_date
          config:
            # First runs need history; warn until Elementary has enough samples
            severity: warn
      - elementary.freshness_anomalies:
          arguments:
            timestamp_column: eval_date
          config:
            severity: warn
    columns:
      - name: symbol
        tests:
          - not_null
          - unique
      - name: eval_date
        tests:
          - not_null
          - sepa_session_is_newest_trading_day
      - name: pass_count
        description: "Number of conditions passed (0-8)"
        tests:
          - assert_pass_count_range:
              arguments:
                min_value: 0
                max_value: 8
          - elementary.column_anomalies:
              arguments:
                timestamp_column: eval_date
                column_anomalies:
                  - null_count
                  - zero_count
              config:
                severity: warn
      - name: insufficient_data
        description: "True if no YoY base data available"

  - name: mart_sepa_fundamental_ext
    description: "25 extended fundamental conditions across 7 groups"
    columns:
      - name: symbol
        tests:
          - not_null
          - unique
      - name: eval_date
        description: "The SEPA session (macro sepa_session), TD-87"
        tests:
          - sepa_session_is_newest_trading_day

  - name: mart_sepa_technical_eval
    description: "11 core technical conditions as boolean columns with pass_count summary"
    tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: eval_date
          config:
            severity: warn
    columns:
      - name: symbol
        tests:
          - not_null
          - unique
      - name: eval_date
        tests:
          - not_null
          - sepa_session_is_newest_trading_day
      - name: pass_count
        description: "Number of conditions passed (0-11)"
        tests:
          - assert_pass_count_range:
              arguments:
                min_value: 0
                max_value: 11

  - name: mart_sepa_tier_momentum
    description: "Tier 2 momentum indicators: RSI, MACD, ROC, RS vs SPY (10 indicators)"
    columns:
      - name: symbol
        tests:
          - not_null
          - unique
      - name: eval_date
        description: "The SEPA session (macro sepa_session), TD-87"
        tests:
          - sepa_session_is_newest_trading_day
      - name: momentum_score
        description: "Normalized momentum score (0-1)"

  - name: mart_sepa_tier_structure
    description: "Tier 3 structure diagnostics: BB squeeze, ADX, Aroon, OBV, volatility contraction"
    columns:
      - name: symbol
        tests:
          - not_null
          - unique
      - name: eval_date
        description: "The SEPA session (macro sepa_session), TD-87"
        tests:
          - sepa_session_is_newest_trading_day
      - name: structure_score
        description: "Normalized structure score (0-1)"

  - name: mart_sepa_tier_sentiment
    description: "Tier 4 short interest and volume sentiment signals"
    columns:
      - name: symbol
        tests:
          - not_null
          - unique
      - name: eval_date
        description: "The SEPA session (macro sepa_session), TD-87"
        tests:
          - sepa_session_is_newest_trading_day
      - name: sentiment_score
        description: "Normalized sentiment score (0-1)"

  - name: mart_sepa_tier_options
    description: >-
      Options structure tier (the 15% "O" of the composite): per dim_universe
      symbol, the newest IV percentile, put/call OI ratio and GEX levels from
      features.option_metric_*, scored 0-1 like sepa_fusion._structure_score / 100.
      Only symbols with at least one option metric have a row (684 of the
      universe on 2026-10-06); composite_score and feature_daily left-join it.
    columns:
      - name: symbol
        tests:
          - not_null
          - unique
      - name: iv_percentile
        description: "Newest 1y IV percentile (option_metric_iv_percentile_daily)"
      - name: pcr_oi
        description: "Newest put/call open-interest ratio (option_metric_pcr_daily)"
      - name: options_structure_score
        description: "Mean of the available IV, PCR, zero-gamma and wall components, 0-1"

  - name: mart_sepa_composite_score
    description: "Weighted composite 30F/35T/20M/15O (fundamental + technical + momentum + options structure)"
    columns:
      - name: symbol
        tests:
          - not_null
          - unique
      - name: eval_date
        description: "The SEPA session (macro sepa_session), TD-87"
        tests:
          - sepa_session_is_newest_trading_day
      - name: composite_score
        description: "Weighted composite score (0-1)"

  - name: mart_sepa_screening_ranked
    description: "Composite scores ranked: overall_rank, percentile, decile"
    columns:
      - name: symbol
        tests:
          - not_null
          - unique
      - name: eval_date
        description: "The SEPA session (macro sepa_session), TD-87"
        tests:
          - sepa_session_is_newest_trading_day
      - name: overall_rank
        tests:
          - not_null
      - name: decile
        description: "Decile bucket 1 (best) to 10"

  - name: mart_sepa_criteria_stats
    description: "Pre-aggregated per-condition pass/fail statistics (domain + stats jsonb). A table: as a view it was dropped by the CASCADE of every upstream rebuild."
    columns:
      - name: domain
        description: "'fundamental' or 'technical'"
        tests:
          - not_null
          - unique
      - name: stats
        description: "jsonb object with per-condition pass/fail counters"
        tests:
          - not_null

  - name: mart_sepa_screener_wide
    description: "Single wide table for all screener queries — fundamental + technical + tiers + universe"
    columns:
      - name: symbol
        tests:
          - not_null
          - unique
      - name: eval_date
        description: "The SEPA session (macro sepa_session), TD-87"
        tests:
          - sepa_session_is_newest_trading_day
      - name: overall_rank
        tests:
          - not_null
      - name: composite_score
        description: "Overall composite score"

  - name: mart_sepa_feature_daily
    description: "Projection mart for features.stock_signal_sepa_daily (dbt-owned; weights 30/35/20/15)"
    columns:
      - name: symbol
        tests:
          - not_null
      - name: trade_date
        description: >-
          The session the row describes: the newest bar in int_stock_daily_enriched
          (macro sepa_session), never the database's UTC clock (TD-87).
        tests:
          - not_null
          - sepa_session_is_newest_trading_day
      - name: sepa_score
        description: "Composite SEPA score 0-100"
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - symbol
              - trade_date
