apiVersion: batch/v1
kind: CronJob
metadata:
  name: research-scan
  namespace: research
  labels:
    app.kubernetes.io/name: research-scan
    app.kubernetes.io/part-of: bifrost-research
    bifrost.research/slot: scan
spec:
  schedule: "35 22 * * 1-5"
  timeZone: UTC
  # Suspended: Dagster research_trading_day / plugin_batch owns this slot
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: research-scan
            bifrost.research/slot: scan
        spec:
          restartPolicy: Never

          initContainers:
            - name: wait-pg
              image: busybox:1.36
              command:
                - sh
                - -c
                - |
                  for i in $(seq 1 60); do
                    if nc -z -w 2 bifrost-postgres-rw.data.svc.cluster.local 5432; then
                      echo ready; exit 0
                    fi
                    echo "wait $i"; sleep 2
                  done
                  exit 1
          containers:
            - name: compute
              image: 192.168.10.73:30500/bifrost-research:0.58.1
              imagePullPolicy: Always
              args:
                - python
                - -m
                - bifrost_research.engines.scan.entry
                - --lookback-days
                - "3"
              envFrom:
                - secretRef:
                    name: bifrost-research-secrets
                    optional: true
              env:
                - name: ANALYTICS_PG_HOST
                  value: "bifrost-postgres-rw.data.svc.cluster.local"
                - name: ANALYTICS_PG_PORT
                  value: "5432"
                - name: ANALYTICS_PG_DATABASE
                  value: "bifrost_golden_source"
                - name: ANALYTICS_PG_USER
                  value: "analytics_writer"
                - name: RESEARCH_WATCHLIST
                  value: "SPY,QQQ,IWM,SPX,NVDA,AAPL,META,GOOG,AMZN,MSFT,TSLA,PLTR,MU,MRVL,ANET,CAVA,CBRS,DAVE,DDOG,ECHO,HIMS,NBIS,NNE,RKLB,SATS,SPCX"
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
