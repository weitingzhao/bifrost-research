[project]
name = "bifrost-research"
version = "0.168.0"
description = "Bifrost Research Engine — OLAP analytics, engines, and Research API"
requires-python = ">=3.11"
dependencies = [
    "dbt-core>=1.8,<2.0",
    "dbt-postgres>=1.8,<2.0",
    "elementary-data[postgres]>=0.16.0,<1.0",
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.32.0",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.27.0",
    "mcp>=1.19.0,<2",
    # The SVI fitter prefers scipy's least_squares and falls back to a pure-Python
    # Nelder-Mead. No image had scipy until 0.153.0, so every fit took the
    # fallback: on 2026-09-30, 13% of 5,370 refits ended at twice the best
    # least-squares objective or worse (median RMSE 1.99 vs 1.74 vol points).
    "scipy>=1.13,<2",
]

[project.optional-dependencies]
orchestration = [
    "dagster>=1.12,<2.0",
    "dagster-dbt>=0.28,<1.0",
    "dagster-webserver>=1.12,<2.0",
    "dagster-postgres>=0.28,<1.0",
    # SQLAlchemy 2.1 maps postgresql:// to psycopg 3, which this image does not
    # install; dagster-postgres then fails at instance start. 0.108.0-dagster and
    # 0.109.0-dagster (2026-09-24) resolved 2.1.0 and crash-looped the daemon.
    "SQLAlchemy>=2.0,<2.1",
]
copilot = [
    "anthropic>=0.30",
    "openai>=1.40",
    "openai-agents>=0.6,<1",
    "croniter>=2.0,<4",
]
dev = [
    "pytest>=8.0",
    "ruff==0.16.9",  # one version for CI and every venv; bump on purpose
    "sqlfluff==4.3.0",  # same pin as the templater; config in src/bifrost_research/dbt/.sqlfluff
    "sqlfluff-templater-dbt==4.3.0",
]

# Dagster code location (alternative to workspace.yaml)
[tool.dagster]
module_name = "bifrost_research.orchestration.definitions"
attribute = "defs"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The dbt project is part of the package, not a build artifact beside it.  A
# non-editable install (i.e. every container) otherwise lands without it, and
# orchestration/paths.py resolves DBT_PROJECT_DIR from the installed package —
# so dagster-dbt found nothing and registered zero assets, silently.  Editable
# installs hid this because __file__ points back at the source tree.
[tool.setuptools.package-data]
bifrost_research = [
    # Documents the API serves (docs/*.md); the blueprint is read from the product.
    "docs/*.md",
    "dbt/dbt_project.yml",
    "dbt/profiles.yml",
    "dbt/packages.yml",
    "dbt/package-lock.yml",
    "dbt/models/**/*.sql",
    "dbt/models/**/*.yml",
    "dbt/macros/**/*.sql",
    "dbt/seeds/**/*",
    "dbt/snapshots/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit rule set. ruff 0.16 widened its default selection from 59 rules to 413,
# so leaving `select` unset made the lint depend on whichever ruff was installed.
# These four groups are the pre-0.16 default; widen them on purpose, not by upgrade.
select = ["E4", "E7", "E9", "F"]
