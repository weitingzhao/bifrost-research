# Research harness CronJob — Wave A+O + LO-0 Loop Orchestrator.
# DEV: unsuspended after Owner sign-off; STG/PROD remain suspended until Trust L0 verified.
# Schedule filter: --schedule=daily_open matches research.objective.schedule.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: research-harness
  namespace: research
  labels:
    app.kubernetes.io/name: research-harness
    app.kubernetes.io/part-of: bifrost-research
    bifrost.research/slot: harness
spec:
  # Pre-open Mon-Fri (UTC); adjust when unsuspended
  schedule: "30 13 * * 1-5"
  timeZone: UTC
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: research-harness
            bifrost.research/slot: harness
        spec:
          restartPolicy: Never
          initContainers:
            - name: wait-pg
              image: busybox:1.36
              command:
                - sh
                - -c
                - |
                  for i in $(seq 1 60); do
                    if nc -z -w 2 bifrost-postgres-rw.data.svc.cluster.local 5432; then
                      echo ready; exit 0
                    fi
                    echo "wait $i"; sleep 2
                  done
                  exit 1
          containers:
            - name: compute
              image: 192.168.10.73:30500/bifrost-research:0.79.2
              imagePullPolicy: Always
              args:
                - python
                - -m
                - bifrost_research.copilot.harness.entry
                - --schedule=daily_open
                - --require-sepa-fresh
                - --batch-mode
              envFrom:
                - secretRef:
                    name: bifrost-research-secrets
                    optional: true
              env:
                - name: ANALYTICS_PG_HOST
                  value: "bifrost-postgres-rw.data.svc.cluster.local"
                - name: ANALYTICS_PG_PORT
                  value: "5432"
                - name: ANALYTICS_PG_DATABASE
                  value: "bifrost_golden_source"
                - name: ANALYTICS_PG_USER
                  value: "analytics_writer"
                # B4: no BIFROST_LOOP_OBJECTIVE_ID — every active objective on
                # --schedule=daily_open runs, each isolated from the others' failures.
                - name: BIFROST_HARNESS_LLM_PLAN
                  value: "1"
                - name: BIFROST_LOOP_BATCH_MODE
                  value: "1"
                # B2 (D-RLA-3): two judges per candidate, one purse per provider.
                # Keys come from bifrost-research-secrets (DEEPSEEK_API_KEY, OPENAI_API_KEY).
                - name: BIFROST_PERSONA_EVAL_AGENTS
                  value: "1"
                - name: PERSONA_EVAL_MODELS
                  value: "deepseek-chat,gpt-4o-mini"
                # Owner decision 2026-09-06: DeepSeek on a short leash until the judges'
                # analysis is worth the tokens — four turns per verdict, and a daily
                # purse. The leash stays; the purse is sized from what four turns
                # actually cost.
                #
                # Measured over the four judged runs of 2026-09-06: DeepSeek billed
                # $0.007, $0.135, $0.405 and then nothing (the purse was spent).
                # Two scheduled objectives a day is $0.28 on a median day and $0.81 on
                # the worst day seen — so $0.50 funded a median day and silently
                # starved a bad one. A starved judge is not a cheaper judge: it falls
                # back to the heuristic, the fallback counts as dissent, and D3's leash
                # then holds every candidate. The purse has to cover a bad day or the
                # unattended loop cannot run on one.
                #
                # $1.50 covers the worst observed day with room for one manual re-run.
                # Ceiling ≈ $33/month, typical ≈ $6.
                - name: PERSONA_EVAL_DAILY_CAP_USD_DEEPSEEK
                  value: "1.50"
                - name: BIFROST_PERSONA_EVAL_MAX_TURNS
                  value: "4"
                - name: PERSONA_EVAL_DAILY_CAP_USD_OPENAI
                  value: "2.0"
                # 0.69.1 acceptance: deepseek-chat needed 13s when it answered and
                # timed out at 45s on 5 of 8 symbols; the 240s batch budget then
                # left the last two symbols unjudged. Judges get two minutes each,
                # the stage fifteen — a daily job can afford the wait.
                - name: BIFROST_PERSONA_EVAL_SYMBOL_TIMEOUT_S
                  value: "120"
                - name: BIFROST_PERSONA_EVAL_TIMEOUT_S
                  value: "900"
                # The judges run their MCP tools in-process, so this pod needs the
                # same Trade read-only backends research-mcp has; without them the
                # portfolio specialist reported "tool configuration issue" and the
                # holdings overlay stayed unavailable (0.69.1 acceptance run).
                - name: TRADE_API_MONITOR_URL
                  value: "http://api-monitor.bifrost-prod.svc.cluster.local:8765"
                - name: TRADE_API_TRADING_URL
                  value: "http://api-trading.bifrost-prod.svc.cluster.local:8769"
                - name: TRADE_API_STRATEGY_URL
                  value: "http://api-strategy.bifrost-prod.svc.cluster.local:8769"
                - name: TRADE_API_MARKET_URL
                  value: "http://api-market.bifrost-prod.svc.cluster.local:8772"
                - name: TRADE_API_TIMEOUT
                  value: "8.0"
                # No RESEARCH_MCP_SSE_URL on purpose: the judges and the curator use the
                # in-process MCP server (ensure_local_mcp_url). The curator's batch-pass
                # guard reads BIFROST_CURATOR_RUN_ID from the MCP tools' own process env,
                # so pointing this pod at the shared research-mcp made every curator
                # write 403 (seen on the 0.69.0 acceptance run).
                - name: PLATFORM_API_URL
                  value: "http://platform-api.bifrost-platform-prod.svc.cluster.local:8780"
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
