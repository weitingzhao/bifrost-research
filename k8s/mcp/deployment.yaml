apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-mcp
  namespace: research
  labels:
    app.kubernetes.io/name: research-mcp
    app.kubernetes.io/part-of: bifrost-research
    bifrost.research/role: mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: research-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: research-mcp
        app.kubernetes.io/part-of: bifrost-research
        bifrost.research/role: mcp
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mcp
          image: 192.168.10.73:30500/bifrost-research:0.65.3
          imagePullPolicy: Always
          args: ["python", "scripts/run_mcp.py"]
          envFrom:
            - secretRef:
                name: bifrost-research-secrets
                optional: true
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8796"
            - name: ANALYTICS_PG_HOST
              value: "bifrost-postgres-rw.data.svc.cluster.local"
            - name: ANALYTICS_PG_PORT
              value: "5432"
            - name: ANALYTICS_PG_DATABASE
              value: "bifrost_golden_source"
            - name: ANALYTICS_PG_USER
              value: "analytics_writer"
            # Wave RS-F5: Trade System read-only bridge (cross-NS cluster DNS)
            - name: TRADE_API_MONITOR_URL
              value: "http://api-monitor.bifrost-prod.svc.cluster.local:8765"
            - name: TRADE_API_TRADING_URL
              value: "http://api-trading.bifrost-prod.svc.cluster.local:8769"
            - name: TRADE_API_STRATEGY_URL
              value: "http://api-strategy.bifrost-prod.svc.cluster.local:8769"
            - name: TRADE_API_MARKET_URL
              value: "http://api-market.bifrost-prod.svc.cluster.local:8772"
            - name: TRADE_API_TIMEOUT
              value: "8.0"
          ports:
            - name: sse
              containerPort: 8796
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: sse
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            tcpSocket:
              port: sse
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: research-mcp
  namespace: research
  labels:
    app.kubernetes.io/name: research-mcp
    app.kubernetes.io/part-of: bifrost-research
    bifrost.research/role: mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: research-mcp
  ports:
    - name: sse
      port: 8796
      targetPort: sse
      protocol: TCP
