version: 2

models:
  - name: stg_income_stmt
    description: "Quarterly and annual income statement data extracted from stock_financials jsonb"
    columns:
      - name: symbol
        tests:
          - not_null
      - name: period_date
        tests:
          - not_null
      - name: period_type
        tests:
          - not_null
          - accepted_values:
              # ttm (trailing twelve months) is 4,138 legitimate rows in
              # stg_income_stmt. The data was right and the whitelist was stale.
              values: ["quarterly", "annual", "ttm"]
      - name: revenue
        description: "Total revenues"
      - name: eps
        description: "Basic earnings per share"
      - name: net_income
        description: "Net income"

  - name: stg_balance_sheet
    description: "Balance sheet data extracted from stock_financials jsonb"
    columns:
      - name: symbol
        tests:
          - not_null
      - name: period_date
        tests:
          - not_null
      - name: total_assets
        description: "Total assets"
      - name: total_equity
        description: "Total shareholders equity"

  - name: stg_cash_flow
    description: "Cash flow statement data extracted from stock_financials jsonb"
    columns:
      - name: symbol
        tests:
          - not_null
      - name: period_date
        tests:
          - not_null
      - name: operating_cf
        description: "Operating cash flow"
      - name: free_cash_flow
        description: "Free cash flow (OCF - CapEx)"

  - name: stg_ratios
    description: "Financial ratios, full market by date, from raw_market.ratios (Financials & Ratios plan)"
    columns:
      - name: symbol
        tests:
          - not_null
      - name: period_date
        tests:
          - not_null
      - name: roe
        description: "Return on equity (vendor return_on_equity)"
      - name: profit_margin
        description: "Null here — not in the ratios payload; derived downstream from the income statement"
      - name: price_to_earnings
        description: "Vendor price_to_earnings"
      - name: market_cap
        description: "Vendor market_cap"

  - name: stg_short_interest
    description: "Short interest data (shares short, days to cover, % float)"
    columns:
      - name: symbol
        tests:
          - not_null
      - name: period_date
        tests:
          - not_null
      - name: shares_short
        description: "Total shares sold short"
      - name: short_pct_float
        description: "Always null — float is not covered by the current subscriptions (the float endpoint answers 404)"
      - name: days_to_cover
        description: "Vendor days_to_cover"
      - name: avg_daily_volume
        description: "Vendor avg_daily_volume, the denominator behind days_to_cover"

  - name: stg_short_volume
    description: "Daily short volume data"
    columns:
      - name: symbol
        tests:
          - not_null
      - name: period_date
        tests:
          - not_null
      - name: short_volume_ratio
        description: "Fraction: short_volume / total_volume (the vendor reports a percent; see short_volume_pct)"
      - name: short_volume_pct
        description: "The vendor's short_volume_ratio, in percent"
